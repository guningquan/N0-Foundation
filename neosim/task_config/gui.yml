save_dir: ./data

decimation: 1

save_frequency: 2
video_frequency: 2
render_frequency: 1   # 1 = open a GUI for live rendering to watch the arms (use 0 for headless recording)

random_texture: false

use_seed: true
episode_num: 1
start_seed: 0
max_seed: 0

sensor_type: gsmini

observations:
  camera: ['rgb']
  tactile: ['rgb', 'rgb_marker', 'marker', 'depth', 'pose', 'gel_particle']
  embodiment: ['joint', 'ee']
  actor: true
